
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111713">
<title>Smart Gear Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
:root{
  --bg:#111713;
  --panel:#1b241e;
  --cream:#f2ead8;
  --muted:#b9b39f;
  --gold:#c5a45b;
  --line:#344238;
  --red:#e56b6b;
  --green:#70c58b;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  background:var(--bg);
  color:var(--cream);
  font-family:Arial,sans-serif;
}
.container{max-width:950px;margin:auto}
h1,h2{color:var(--gold)}
h1{text-align:center}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  margin:16px 0;
}
input,textarea,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid var(--line);
  font-size:15px;
}
input,textarea{
  background:#111713;
  color:var(--cream);
}
textarea{min-height:85px;resize:vertical}
button{
  background:var(--gold);
  color:#111713;
  font-weight:bold;
  border:0;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.btn-red{background:#a94343;color:white}
.btn-green{background:#347d4d;color:white}
.btn-gray{background:#45534a;color:white}
.hidden{display:none!important}
#message{padding:10px;border-radius:8px;white-space:pre-wrap}
.product{
  border:1px solid var(--line);
  padding:12px;
  border-radius:12px;
  margin:12px 0;
  display:flex;
  gap:12px;
  align-items:center;
}
.product img{
  width:85px;
  height:85px;
  object-fit:cover;
  border-radius:8px;
  background:#111713;
}
.product-info{flex:1;min-width:0}
.product-info p{margin:5px 0;color:var(--muted);overflow-wrap:anywhere}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{width:auto;padding:9px 12px}
.status{color:var(--green)}
.discount{color:var(--gold);font-weight:bold}
.small{font-size:13px;color:var(--muted)}
@media(max-width:520px){
  body{padding:10px}
  .product{align-items:flex-start}
  .product img{width:70px;height:70px}
  .actions button{font-size:12px}
}
</style>
</head>

<body>
<div class="container">

<h1>Smart Gear Admin</h1>

<div id="loginBox" class="card">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn" onclick="login()">Login</button>
  <div id="loginMessage"></div>
</div>

<div id="adminPanel" class="hidden">

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2>Dashboard</h2>
      <button class="btn-red" style="width:auto" onclick="logout()">Logout</button>
    </div>
    <p class="status">Admin হিসেবে লগইন করা হয়েছে।</p>
  </div>

  <div class="card">
    <h2>নতুন প্রোডাক্ট যোগ করুন</h2>

    <label>প্রোডাক্টের নাম</label>
    <input id="title" placeholder="Product name">

    <label>বিস্তারিত</label>
    <textarea id="description" placeholder="Product description"></textarea>

    <label>মূল দাম (৳)</label>
    <input id="price" type="number" min="0" step="0.01" placeholder="1000">

    <label>Discount (%)</label>
    <input id="discount" type="number" min="0" max="100" step="0.01" value="0" placeholder="20">

    <p id="pricePreview" class="discount">বিক্রয়মূল্য: ৳০</p>

    <label>প্রোডাক্টের ছবি</label>
    <input id="imageFile" type="file" accept="image/*">

    <label>অথবা ছবির URL (ঐচ্ছিক)</label>
    <input id="imageUrl" type="url" placeholder="https://example.com/image.jpg">

    <button id="addBtn" onclick="addProduct()">প্রোডাক্ট যোগ করুন</button>
    <div id="addMessage"></div>
  </div>

  <div class="card">
    <h2>প্রোডাক্ট তালিকা</h2>
    <button class="btn-gray" onclick="loadProducts()">Refresh Products</button>
    <div id="productsList">লোড হচ্ছে...</div>
  </div>

</div>
</div>

<script>
const db = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);

const BUCKET = "product-assets";

let currentUser = null;
let products = [];

function el(id){
  return document.getElementById(id);
}

function safeText(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function showMessage(id,message,isError=false){
  el(id).textContent = message;
  el(id).style.color = isError ? "#ff8585" : "#70c58b";
}

function updatePricePreview(){
  const price = Number(el("price").value) || 0;
  const discount = Math.min(100,Math.max(0,Number(el("discount").value)||0));
  const finalPrice = price * (100-discount)/100;

  el("pricePreview").textContent =
    "বিক্রয়মূল্য: ৳" + finalPrice.toFixed(2);
}

el("price").addEventListener("input",updatePricePreview);
el("discount").addEventListener("input",updatePricePreview);

async function login(){
  const email = el("email").value.trim();
  const password = el("password").value;

  if(!email || !password){
    showMessage("loginMessage","Email ও Password দিন।",true);
    return;
  }

  el("loginBtn").disabled = true;
  showMessage("loginMessage","লগইন হচ্ছে...");

  const {data,error} = await db.auth.signInWithPassword({
    email,
    password
  });

  el("loginBtn").disabled = false;

  if(error){
    showMessage("loginMessage",error.message,true);
    return;
  }

  await checkAdmin(data.user);
}

async function checkAdmin(user){
  if(!user){
    el("loginBox").classList.remove("hidden");
    el("adminPanel").classList.add("hidden");
    return;
  }

  const {data,error} = await db
    .from("admins")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error || !data){
    await db.auth.signOut();
    showMessage(
      "loginMessage",
      "এই অ্যাকাউন্টটি Admin হিসেবে অনুমোদিত নয়।",
      true
    );
    el("loginBox").classList.remove("hidden");
    el("adminPanel").classList.add("hidden");
    return;
  }

  currentUser = user;
  el("loginBox").classList.add("hidden");
  el("adminPanel").classList.remove("hidden");

  await loadProducts();
}

async function logout(){
  await db.auth.signOut();
  currentUser = null;
  products = [];
  el("adminPanel").classList.add("hidden");
  el("loginBox").classList.remove("hidden");
}

async function uploadImage(file){
  if(!file) return null;

  if(!file.type.startsWith("image/")){
    throw new Error("শুধু ছবির ফাইল আপলোড করুন।");
  }

  if(file.size > 5*1024*1024){
    throw new Error("ছবির সাইজ ৫ MB-এর কম হতে হবে।");
  }

  const extension = file.name.split(".").pop().replace(/[^a-zA-Z0-9]/g,"") || "jpg";
  const path = Date.now() + "-" + Math.random().toString(36).slice(2) + "." + extension;

  const {error} = await db.storage
    .from(BUCKET)
    .upload(path,file,{
      cacheControl:"3600",
      upsert:false
    });

  if(error) throw error;

  const {data} = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function addProduct(){
  if(!currentUser) return;

  const title = el("title").value.trim();
  const description = el("description").value.trim();
  const price = Number(el("price").value);
  const discount = Number(el("discount").value);
  const file = el("imageFile").files[0];

  if(!title){
    showMessage("addMessage","প্রোডাক্টের নাম লিখুন।",true);
    return;
  }

  if(!Number.isFinite(price) || price < 0){
    showMessage("addMessage","সঠিক দাম লিখুন।",true);
    return;
  }

  if(!Number.isFinite(discount) || discount < 0 || discount > 100){
    showMessage("addMessage","Discount ০ থেকে ১০০-এর মধ্যে দিন।",true);
    return;
  }

  el("addBtn").disabled = true;
  showMessage("addMessage","প্রোডাক্ট যোগ হচ্ছে...");

  try{
    let image_url = el("imageUrl").value.trim();

    if(file){
      image_url = await uploadImage(file);
    }

    const {error} = await db.from("products").insert({
      title,
      description,
      price,
      original_price:price,
      discount_percent:discount,
      image_url:image_url || null,
      is_active:true
    });

    if(error) throw error;

    el("title").value = "";
    el("description").value = "";
    el("price").value = "";
    el("discount").value = "0";
    el("imageFile").value = "";
    el("imageUrl").value = "";
    updatePricePreview();

    showMessage("addMessage","প্রোডাক্ট সফলভাবে যোগ হয়েছে।");
    await loadProducts();

  }catch(error){
    showMessage("addMessage","সমস্যা: " + error.message,true);
  }

  el("addBtn").disabled = false;
}

async function loadProducts(){
  if(!currentUser) return;

  el("productsList").textContent = "প্রোডাক্ট লোড হচ্ছে...";

  const {data,error} = await db
    .from("products")
    .select("id,title,description,price,original_price,discount_percent,image_url,is_active,created_at")
    .order("created_at",{ascending:false});

  if(error){
    el("productsList").textContent = "প্রোডাক্ট লোড হয়নি: " + error.message;
    return;
  }

  products = data || [];

  if(products.length === 0){
    el("productsList").textContent = "এখনো কোনো প্রোডাক্ট নেই।";
    return;
  }

  el("productsList").innerHTML = products.map(p => {
    const discount = Number(p.discount_percent || 0);
    const basePrice = Number(p.price || 0);
    const finalPrice = basePrice * (100-discount)/100;

    return `
      <div class="product">
        <img src="${safeText(p.image_url || "")}"
             alt="${safeText(p.title)}"
             onerror="this.style.display='none'">

        <div class="product-info">
          <strong>${safeText(p.title)}</strong>
          <p>মূল দাম: ৳${basePrice.toFixed(2)}</p>
          <p class="discount">Discount: ${discount}%</p>
          <p>বিক্রয়মূল্য: ৳${finalPrice.toFixed(2)}</p>
          <p>${p.is_active ? "🟢 Active" : "🔴 Inactive"}</p>

          <div class="actions">
            <button onclick="editProduct('${safeText(p.id)}')">Edit</button>
            <button class="btn-green" onclick="toggleProduct('${safeText(p.id)}',${!p.is_active})">
              ${p.is_active ? "Inactive" : "Active"}
            </button>
            <button class="btn-red" onclick="deleteProduct('${safeText(p.id)}')">Delete</button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function editProduct(id){
  const p = products.find(item => String(item.id) === String(id));
  if(!p) return;

  const title = prompt("প্রোডাক্টের নাম:",p.title);
  if(title === null) return;

  const description = prompt("প্রোডাক্টের বিবরণ:",p.description || "");
  if(description === null) return;

  const priceInput = prompt("মূল দাম (৳):",p.price);
  if(priceInput === null) return;

  const discountInput = prompt("Discount (%):",p.discount_percent || 0);
  if(discountInput === null) return;

  const price = Number(priceInput);
  const discount = Number(discountInput);

  if(!title.trim() || !Number.isFinite(price) || price < 0 ||
     !Number.isFinite(discount) || discount < 0 || discount > 100){
    alert("সঠিক নাম, দাম ও Discount দিন।");
    return;
  }

  const {error} = await db.from("products").update({
    title:title.trim(),
    description:description.trim(),
    price,
    original_price:price,
    discount_percent:discount
  }).eq("id",p.id);

  if(error){
    alert("আপডেট হয়নি: " + error.message);
    return;
  }

  alert("প্রোডাক্ট আপডেট হয়েছে।");
  await loadProducts();
}

async function toggleProduct(id,active){
  const {error} = await db.from("products")
    .update({is_active:active})
    .eq("id",id);

  if(error){
    alert("পরিবর্তন হয়নি: " + error.message);
    return;
  }

  await loadProducts();
}

async function deleteProduct(id){
  if(!confirm("এই প্রোডাক্টটি মুছে ফেলতে চান?")) return;

  const {error} = await db.from("products")
    .delete()
    .eq("id",id);

  if(error){
    alert("ডিলিট হয়নি: " + error.message);
    return;
  }

  alert("প্রোডাক্ট ডিলিট হয়েছে।");
  await loadProducts();
}

db.auth.getSession().then(({data}) => {
  checkAdmin(data.session?.user || null);
});

db.auth.onAuthStateChange((event,session) => {
  if(event === "SIGNED_OUT"){
    currentUser = null;
    el("adminPanel").classList.add("hidden");
    el("loginBox").classList.remove("hidden");
  }
});
</script>
</body>
</html>
